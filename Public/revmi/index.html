<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0d0e11">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RevMi">
  <meta name="application-name" content="RevMi">
  <title>RevMi — panel RevSerwis</title>
  <link rel="manifest" href="/revmi/manifest.webmanifest">
  <link rel="icon" href="/revmi/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/revmi/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/revmi/app.css?v=4.0.0">
  <script defer src="/assets/divisions.js?v=4.0.0"></script>
  <script defer src="/revmi/app-core.js?v=4.0.0"></script>
  <script defer src="/revmi/app-views.js?v=4.0.0"></script>
  <script defer src="/revmi/app-biz.js?v=4.0.0"></script>
  <script defer src="/revmi/app-main.js?v=4.0.0"></script>
</head>
<body class="booting">
  <!-- Ekran startowy -->
  <div class="splash" id="splash" aria-hidden="true">
    <img src="/revmi/icons/mark-256.png" alt="" class="splash-logo">
    <div class="spinner"></div>
  </div>

  <!-- Logowanie PIN -->
  <section class="login" id="login" hidden>
    <div class="login-glow"></div>
    <form class="login-card" id="loginForm" autocomplete="off">
      <img class="login-logo" src="/revmi/icons/mark-256.png" alt="RevSerwis">
      <h1>RevMi</h1>
      <p class="muted">Panel RevSerwis — zlecenia, notatnik, oferty i powiadomienia. Wpisz swój kod PIN.</p>
      <div class="pin-dots" id="pinDots" aria-hidden="true"></div>
      <input id="pinInput" class="pin-hidden" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-label="Kod PIN">
      <div class="login-error" id="loginError" role="alert"></div>
      <div class="keypad" id="keypad">
        <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
        <button type="button" data-key="back" aria-label="Usuń"><i class="fa-solid fa-delete-left"></i></button>
        <button type="button" data-key="0">0</button>
        <button type="submit" class="key-ok" id="loginSubmit" aria-label="Zaloguj" disabled><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <p class="login-foot"><i class="fa-solid fa-lock"></i> Połączenie szyfrowane · <span id="loginClock"></span></p>
    </form>
  </section>

  <!-- Aplikacja -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/pulpit"><img src="/revmi/icons/mark-256.png" alt=""><span><strong>RevMi</strong><small>RevSerwis</small></span></a>
      <nav class="nav" id="sideNav"></nav>
      <div class="side-bottom">
        <button class="install-btn" id="installBtn" hidden><i class="fa-solid fa-mobile-screen"></i> Zainstaluj aplikację</button>
        <div class="me">
          <div class="avatar" id="meAvatar">RM</div>
          <div class="me-text"><strong id="meName">—</strong><small id="meRole">—</small></div>
          <button class="icon-btn ghost" id="logoutBtn" title="Wyloguj"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <img class="topbar-logo" src="/revmi/icons/mark-256.png" alt="">
          <h1 class="topbar-title" id="topbarTitle">RevMi</h1>
          <label class="search" id="searchBox">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="globalSearch" type="search" placeholder="Szukaj zlecenia, klienta, telefonu…" autocomplete="off">
            <kbd data-action="palette" title="Szukaj wszędzie (Ctrl+K)">Ctrl K</kbd>
          </label>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn mobile-only" id="searchToggle" aria-label="Szukaj"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="icon-btn desktop-only" data-action="palette" aria-label="Szukaj wszędzie" title="Szukaj wszędzie (Ctrl+K)"><i class="fa-solid fa-bolt"></i></button>
          <button class="icon-btn" id="refreshBtn" aria-label="Odśwież" title="Odśwież"><i class="fa-solid fa-rotate"></i></button>
          <a class="icon-btn" href="#/powiadomienia" id="bellBtn" aria-label="Powiadomienia"><i class="fa-regular fa-bell"></i><span class="dot" id="bellDot" hidden></span></a>
          <button class="btn primary admin-only desktop-only" data-action="new-task"><i class="fa-solid fa-plus"></i> Nowe zlecenie</button>
        </div>
      </header>

      <div class="offline-bar" id="offlineBar" hidden><i class="fa-solid fa-wifi"></i> Brak internetu — wyświetlam ostatnio pobrane dane</div>
      <main class="content" id="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
    <button class="fab" data-action="quick-add" aria-label="Szybko dodaj"><i class="fa-solid fa-plus"></i></button>
  </div>

  <!-- Szczegóły zlecenia -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-modal="true" role="dialog" hidden></aside>

  <!-- Arkusz „Więcej” (telefon) -->
  <div class="sheet-backdrop" id="moreBackdrop" hidden></div>
  <div class="sheet" id="moreSheet" hidden></div>

  <dialog class="modal" id="modal"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
