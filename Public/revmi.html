<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#050505"><title>RevMi — Centrum operacyjne</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--bg:#050505;--panel:#111;--line:#ffffff14;--muted:#9ca3af;--text:#f3f4f6;--green:#10b981;--light:#34d399;--red:#ef4444;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'Plus Jakarta Sans',sans-serif}body:before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 0 0,#10b98118,transparent 40%);pointer-events:none}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}a{color:inherit;text-decoration:none}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--light);outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:30px;letter-spacing:-1.2px;margin-bottom:8px}h2{font-size:18px}h3{font-size:15px}small,.muted{color:var(--muted)}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:240px;padding:28px 18px;background:#080a09ed;border-right:1px solid var(--line);overflow:auto;z-index:30;backdrop-filter:blur(25px)}.brand{display:flex;gap:12px;align-items:center;margin:0 12px 30px}.brand-icon{width:40px;height:40px;display:grid;place-items:center;background:var(--green);color:#02140e;border-radius:13px;font-size:20px}.brand strong{font-size:24px;letter-spacing:-1px}.brand small{display:block;font-size:10px;letter-spacing:2px}.nav-label{font-size:10px;letter-spacing:1.7px;color:#6b7280;margin:25px 12px 10px}.nav button{border:0;display:flex;align-items:center;gap:12px;color:#9ca3af;background:transparent;width:100%;text-align:left;padding:12px;border-radius:12px;margin:3px 0}.nav button:hover{background:#ffffff05;color:white}.nav button.active{color:var(--light);background:#10b98112;border:1px solid #10b98125}.nav i{width:18px}.count{font-size:10px;margin-left:auto;background:#ffffff0d;border-radius:6px;padding:3px 6px}.sidebar-bottom{border-top:1px solid var(--line);padding:20px 10px;margin-top:24px}.workspace{grid-column:2;min-width:0}.topbar{display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:#050505e8;backdrop-filter:blur(20px);padding:18px 32px}.topbar .search{max-width:360px;flex:1}.topbar .month{margin-left:auto}.content{max-width:1600px;margin:auto;padding:32px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.heading p{color:var(--muted);font-size:13px;margin:0;line-height:1.7}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#ffffff05;color:var(--text);border-radius:11px;padding:11px 15px;font-weight:600;display:inline-flex;justify-content:center;align-items:center;gap:8px}.btn:hover{border-color:#10b98170;background:#10b9810b}.btn.primary{color:#02160f;background:var(--green);border-color:var(--green);font-weight:800}.btn.danger{color:#fca5a5;border-color:#ef444435}.btn.small{padding:7px 10px;font-size:12px}.btn.icon{width:38px;padding:10px}.input{width:100%;border:1px solid var(--line);background:#0b0d0c;color:var(--text);padding:12px 14px;border-radius:11px;outline:0;color-scheme:dark;min-width:0}.input:focus{border-color:var(--green)}textarea.input{resize:vertical;line-height:1.7;min-height:100px}.input::placeholder{color:#6b7280}.month{max-width:175px}.card{border:1px solid var(--line);background:linear-gradient(140deg,#141715bd,#0b0c0be6);border-radius:20px;padding:24px;box-shadow:0 8px 30px #0002}.grid{display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{position:relative;min-width:0}.stat strong{font-size:28px;display:block;letter-spacing:-1px;margin:15px 0 8px;overflow-wrap:anywhere}.stat .mark{float:right;color:var(--green);background:#10b98112;border-radius:10px;padding:10px}.stat.profit{border-color:#10b98145;background:linear-gradient(130deg,#10b98118,#0b100de6)}.stat small{font-size:11px}.section-gap{margin-top:24px}.table-wrap{border:1px solid var(--line);border-radius:18px;overflow:auto;background:#0c0d0c}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9ca3af;font-weight:600;padding:16px;background:#ffffff03}td{padding:16px;border-top:1px solid var(--line)}td .sub{display:block;color:#9ca3af;font-size:11px;margin-top:6px;max-width:280px;white-space:normal}td.wrap{white-space:normal;min-width:190px}tbody tr:hover{background:#ffffff02}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:7px;font-size:10px;background:#ffffff09;color:#d1d5db;font-weight:700;white-space:nowrap}.badge.new{background:#3b82f61a;color:#93c5fd}.badge.quoted{background:#a78bfa18;color:#c4b5fd}.badge.planned,.badge.completed{background:#10b98118;color:#34d399}.badge.progress{background:#f59e0b18;color:#fbbf24}.badge.cancelled{background:#ef444417;color:#fca5a5}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.filters button{border:1px solid var(--line);background:transparent;color:#9ca3af;padding:8px 13px;border-radius:9px;font-size:12px}.filters .active{background:#10b98114;color:var(--light);border-color:#10b98135}.empty{padding:45px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:#9ca3af;line-height:1.8}.empty i{font-size:28px;display:block;margin-bottom:15px;color:#10b98180}.order{display:flex;flex-direction:column}.order .title{display:flex;justify-content:space-between;gap:10px}.order h3{font-size:17px;line-height:1.5;margin:14px 0}.order p{color:var(--muted);font-size:12px;line-height:1.8}.order .actions{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}.list-line{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.list-line:last-child{border:0}.list-line small{display:block;margin-top:4px}.notice{padding:14px 18px;border:1px solid #10b98135;border-radius:12px;background:#10b98108;line-height:1.8;font-size:12px;color:#a7f3d0}.notice.warn{color:#fde68a;background:#f59e0b08;border-color:#f59e0b30}.error{color:#fecaca;border:1px solid #ef444440;background:#ef44440c;border-radius:12px;padding:14px;line-height:1.6}.dialog{color:var(--text);background:#0c0e0dfc;border:1px solid #10b98135;box-shadow:0 30px 100px #000b;border-radius:24px;padding:0;width:min(900px,95vw);max-height:92dvh;overflow:auto}.dialog::backdrop{background:#000b;backdrop-filter:blur(7px)}.dialog-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:15px;background:#0c0e0dfa;border-bottom:1px solid var(--line);padding:22px 26px;z-index:2}.dialog-head h2{margin:0;font-size:20px}.dialog-body{padding:26px}.dialog-foot{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);margin-top:24px;padding-top:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field.full{grid-column:1/-1}.field label{display:block;color:#d1d5db;font-size:12px;margin-bottom:8px}.field small{display:block;font-size:11px;line-height:1.6;margin-top:6px}.check{display:flex!important;align-items:center;gap:10px}.check input{accent-color:var(--green);width:18px;height:18px}.preserve{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:12px;color:#d1d5db}.timeline{border-left:1px solid #10b98140;padding-left:18px;margin:20px 0}.timeline p{position:relative;margin-bottom:20px;font-size:12px;line-height:1.8}.timeline p:before{content:'';position:absolute;left:-23px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--green)}.photos{display:flex;gap:12px;flex-wrap:wrap}.photos img{width:150px;height:110px;object-fit:cover;border-radius:12px}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.login .card{max-width:420px;width:100%;padding:40px}.login h1{margin-top:25px}.pin{letter-spacing:12px;text-align:center;font-size:28px;margin:18px 0}.login .btn{width:100%}.toast{position:fixed;bottom:25px;right:25px;border:1px solid #10b98150;background:#101913;color:#d1fae5;border-radius:14px;max-width:400px;padding:18px;z-index:100;box-shadow:0 15px 60px #0007}.mobile-menu{display:none}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden}.day{min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px;min-width:0}.day strong{font-size:12px;color:#9ca3af}.day button{display:block;white-space:normal;text-align:left;width:100%;margin-top:8px;padding:7px;border:0;border-radius:7px;background:#10b98114;color:#a7f3d0;font-size:10px;overflow-wrap:anywhere}.day-head{background:#ffffff05;text-align:center;padding:12px;font-size:10px;color:#9ca3af}.bottom-note{color:#6b7280;font-size:11px;line-height:1.8;padding-top:24px}details summary{cursor:pointer;font-size:13px;margin-bottom:14px}.all-time{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;padding:18px 0;color:var(--muted)}.all-time strong{color:var(--text);margin-left:6px}.mini{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
@media(max-width:1150px){.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:16px 22px}.content{padding:24px}}@media(max-width:800px){.app{display:block}.sidebar{transform:translateX(-100%);transition:transform .25s}.sidebar.open{transform:none;box-shadow:0 0 0 100vmax #0008}.mobile-menu{display:inline-flex}.topbar{padding:12px;gap:8px}.content{padding:20px 14px}.topbar .search{min-width:90px}.month{max-width:140px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:26px}.grid.two,.grid{grid-template-columns:1fr}.grid.four{gap:10px}.stat{padding:18px}.stat strong{font-size:22px}.stat .mark{display:none}.form-grid{grid-template-columns:1fr}.dialog-body{padding:20px}.dialog-head{padding:18px 20px}.calendar{overflow:auto;grid-template-columns:repeat(7,minmax(115px,1fr))}.dialog-foot{flex-wrap:wrap}.day{min-height:100px}.topbar .refresh-label{display:none}.toast{bottom:14px;right:14px;left:14px;max-width:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{.sidebar,.topbar,.heading .actions,.dialog-foot,.btn{display:none!important}.app{display:block}.workspace{margin:0}body,.card,.table-wrap{background:white;color:black;box-shadow:none}td,th{color:black;border-color:#ddd}}
</style></head><body>
<section class="login" id="login"><form class="card" id="loginForm"><div class="brand-icon"><i class="fa-solid fa-layer-group" aria-hidden="true"></i></div><h1>Witaj w RevMi<span style="color:var(--green)">.</span></h1><p class="muted">Twoje zlecenia, ludzie i finanse w jednym miejscu.</p><label for="pin">Kod dostępu</label><input class="input pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="current-password" required autofocus><div id="loginError" class="error" hidden></div><button class="btn primary" type="submit">Otwórz panel <i class="fa-solid fa-arrow-right"></i></button><p class="bottom-note">Użyj dotychczasowego PIN-u administratora lub swojego kodu pracownika.</p></form></section>
<div class="app" id="app" hidden><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon"><i class="fa-solid fa-layer-group"></i></span><div><strong>RevMi<span style="color:var(--green)">.</span></strong><small>CENTRUM OPERACYJNE</small></div></div><nav class="nav" id="nav"></nav><div class="sidebar-bottom"><strong id="userName"></strong><small id="userRole" style="display:block;margin:7px 0 18px"></small><button class="btn small" id="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Wyloguj</button></div></aside><main class="workspace"><header class="topbar"><button class="btn icon mobile-menu" id="menu" aria-label="Otwórz menu"><i class="fa-solid fa-bars"></i></button><input class="input search" id="search" type="search" placeholder="Szukaj w tej zakładce…" aria-label="Szukaj"><label class="month"><span class="mini">Miesiąc raportu</span><input class="input" id="month" type="month" aria-label="Miesiąc raportu"></label><button class="btn" id="refresh"><i class="fa-solid fa-rotate"></i><span class="refresh-label">Odśwież</span></button></header><div class="content"><div id="pageError" class="error" hidden></div><div id="screen"></div></div></main></div>
<dialog class="dialog" id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button type="button" class="btn icon" id="closeModal" aria-label="Zamknij"><i class="fa-solid fa-xmark"></i></button></div><div class="dialog-body" id="modalBody"></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const API_URL=''; // Puste dla panelu i backendu pod tą samą domeną.
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(Number(v)||0),id=v=>v?String(v._id||v):'';
const statusNames={new:'Nowa wycena',quoted:'Oferta gotowa',planned:'Zaplanowane',progress:'W realizacji',completed:'Zrealizowane',cancelled:'Anulowane'};
const viewNames={dashboard:'Pulpit',quotes:'Wyceny',orders:'Do realizacji',calendar:'Kalendarz',archive:'Archiwum',clients:'Baza klientów',employees:'Pracownicy',fleet:'Flota',costs:'Wszystkie koszty',income:'Przychody',reports:'Raporty',history:'Historia zmian'};
const dt=v=>v?new Intl.DateTimeFormat('pl-PL',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Warsaw'}).format(new Date(v)):'Do ustalenia';
const monthOf=v=>v?new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',timeZone:'Europe/Warsaw'}).format(new Date(v)).slice(0,7):'';
const localDate=v=>{const d=new Date(v||Date.now());return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
const badge=s=>`<span class="badge ${esc(s)}">${esc(statusNames[s]||s)}</span>`;
let state={tasks:[],clients:[],employees:[],fleet:[],ledger:null},user=null,view='dashboard',filter='all',mode='table',loading=false,dialogBusy=false,photoUrls=[],toastTimer,autoMonth=true;
$('month').value=monthOf(new Date());
async function api(path,options={}){const r=await fetch(API_URL+path,{...options,credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)lock();throw Error(data.message||'Nie udało się wykonać operacji.')}return data;}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
function lock(){user=null;$('app').hidden=true;$('login').hidden=false;if($('modal').open)$('modal').close();}
function admin(){return user?.role==='admin'}
async function load(){if(loading||!user)return;loading=true;$('refresh').disabled=true;try{state=await api('/api/v3/data?month='+encodeURIComponent($('month').value));$('pageError').hidden=true;renderNav();render()}catch(e){$('pageError').textContent=e.message;$('pageError').hidden=false}finally{loading=false;$('refresh').disabled=false}}
function renderNav(){const list=[['OPERACJE',[['dashboard','gauge-high'],['quotes','file-invoice-dollar'],['orders','truck-fast'],['calendar','calendar-days'],['archive','box-archive']]],['ZASOBY',[['clients','address-book'],['employees','users'],['fleet','van-shuttle']]],['FINANSE I KONTROLA',[['costs','receipt'],['income','wallet'],['reports','chart-simple'],['history','clock-rotate-left']]]];$('nav').innerHTML=list.map(([group,items])=>{items=items.filter(([key])=>admin()||['orders','calendar'].includes(key));return items.length?`<div class="nav-label">${group}</div>`+items.map(([key,icon])=>`<button data-view="${key}" class="${view===key?'active':''}"><i class="fa-solid fa-${icon}"></i>${viewNames[key]}${['orders','quotes'].includes(key)?`<span class="count">${state.tasks.filter(t=>(key==='quotes'?['new','quoted']:['planned','progress']).includes(t.status)).length}</span>`:''}</button>`).join(''):''}).join('')}
function go(v){view=v;filter='all';$('search').value='';$('sidebar').classList.remove('open');renderNav();render()}
const search=arr=>{const q=$('search').value.toLocaleLowerCase('pl');return q?arr.filter(x=>JSON.stringify(x).toLocaleLowerCase('pl').includes(q)):arr};
const empty=(text='Brak wpisów w tym widoku.')=>`<div class="empty"><i class="fa-regular fa-folder-open"></i>${esc(text)}</div>`;
const table=(headers,rows)=>rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty();
const button=(text,action,entity='',cls='')=>`<button type="button" class="btn ${cls}" data-action="${action}" data-id="${esc(entity)}">${text}</button>`;
function heading(title,desc,actions=''){return `<div class="heading"><div><span class="mini">RevSerwis / ${esc(viewNames[view]||'Panel')}</span><h1 style="margin-top:9px">${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function stat(label,value,sub,icon='chart-simple',cls=''){return `<article class="card stat ${cls}"><span class="mark"><i class="fa-solid fa-${icon}"></i></span><span class="muted">${label}</span><strong>${value}</strong><small>${sub}</small></article>`}
function taskActions(t){let out=button('Szczegóły','task',t._id,'small');if(!admin())return out;if(t.status==='new')out+=button('Przygotuj wycenę','offer',t._id,'small primary');if(t.status==='quoted')out+=button('Klient akceptuje','accept',t._id,'small primary');if(t.status==='planned')out+=button('Rozpocznij','start',t._id,'small primary');if(t.status==='progress')out+=button('Zakończ i rozlicz','complete',t._id,'small primary');return out}
function taskTable(tasks){return table(['Zlecenie / klient','Termin','Status',...(admin()?['Kwota']:[]),'Pojazd / ekipa','Działania'],tasks.map(t=>[`<strong>${esc(t.name)}</strong><span class="sub">${esc(t.number)} · ${esc(t.clientName||'Bez nazwy')}<br>${esc(t.address)}</span>`,['new','quoted'].includes(t.status)?'Do ustalenia':dt(t.dateStart),badge(t.status),...(admin()?[money(t.finalPrice??t.price)]:[]),`${esc(t.car||'Bez pojazdu')}<span class="sub">${esc((t.workers||[]).map(w=>w.name).join(', ')||'Bez ekipy')}</span>`,`<div class="actions">${taskActions(t)}</div>`]))}
function render(){const s=$('screen');if(view==='dashboard')s.innerHTML=dashboard();else if(['quotes','orders','archive'].includes(view))s.innerHTML=taskView();else if(view==='calendar')s.innerHTML=calendar();else if(view==='clients')s.innerHTML=clientsView();else if(view==='employees')s.innerHTML=employeesView();else if(view==='fleet')s.innerHTML=fleetView();else if(['costs','income'].includes(view))s.innerHTML=financeView();else if(view==='reports')s.innerHTML=reports();else s.innerHTML=historyView();}
function dashboard(){const l=state.ledger?.totals||{},active=state.tasks.filter(t=>['planned','progress'].includes(t.status)),quotes=state.tasks.filter(t=>['new','quoted'].includes(t.status));const due=state.fleet.filter(f=>f.active&&['insuranceUntil','inspectionUntil','nextServiceDate'].some(k=>f[k]&&new Date(f[k])<=new Date(Date.now()+30*86400000)));return heading('Dzień pod kontrolą.','Wynik miesiąca '+esc($('month').value)+' oraz bieżące sprawy do załatwienia.',button('Nowa wycena','new-task','','primary')+button('Dodaj koszt','expense'))+`<div class="grid four">${stat('Przychód miesiąca',money(l.income),'Zakończone zlecenia + inne przychody','wallet')}${stat('Koszty miesiąca',money(l.cost),'Zlecenia, flota, wynagrodzenia','receipt')}${stat('Wynik operacyjny',money(l.profit),'Przychód minus zarejestrowane koszty','arrow-trend-up','profit')}${stat('Zakończone w miesiącu',l.completed||0,'Nowe zgłoszenia ze strony: '+(l.newQuotes||0),'circle-check')}</div><div class="all-time">Łącznie od początku: <span>Przychód<strong>${money(l.allIncome)}</strong></span><span>Koszty<strong>${money(l.allCost)}</strong></span><span>Wynik<strong>${money(l.allProfit)}</strong></span></div><div class="grid two"><article class="card"><h2>Do podjęcia decyzji</h2><div class="list-line"><div>Wyceny oczekujące<small>Nowe i przygotowane oferty</small></div><strong>${quotes.length}</strong>${button('Otwórz','view-quotes','','small')}</div><div class="list-line"><div>Do realizacji<small>Zaplanowane i w trakcie</small></div><strong>${active.length}</strong>${button('Otwórz','view-orders','','small')}</div><div class="list-line"><div>Nierozliczone zakończone<small>Przychód rozpoznany, płatność do sprawdzenia</small></div><strong>${state.tasks.filter(t=>t.status==='completed'&&t.paymentStatus!=='paid').length}</strong>${button('Archiwum','view-archive','','small')}</div></article><article class="card"><h2>Flota — nadchodzące terminy</h2>${due.length?due.map(f=>`<div class="list-line"><div>${esc(f.name)}<small>${esc(f.plates)} · sprawdź przegląd, OC lub serwis</small></div>${button('Szczegóły','vehicle',f._id,'small')}</div>`).join(''):'<p class="muted">Brak zapisanych terminów przypadających w ciągu 30 dni.</p>'}</article></div><section class="section-gap"><h2>Najbliższe realizacje</h2>${taskTable(active.sort((a,b)=>new Date(a.dateStart)-new Date(b.dateStart)).slice(0,6))}</section><p class="bottom-note">Raport miesiąca nie usuwa starszych danych. Przychód zlecenia trafia do wyniku po zakończeniu, nawet jeśli płatność nie jest jeszcze oznaczona jako otrzymana.</p>`}
function taskView(){const statuses=view==='quotes'?['new','quoted']:view==='orders'?['planned','progress']:['completed','cancelled'];let items=search(state.tasks.filter(t=>statuses.includes(t.status)));if(filter!=='all')items=items.filter(t=>filter==='unpaid'?t.status==='completed'&&t.paymentStatus!=='paid':t.status===filter);const desc=view==='quotes'?'Ustal kwotę, skopiuj ofertę i przyjmij zlecenie po zgodzie klienta.':view==='orders'?'Tylko przyjęte zlecenia. Zakończone automatycznie trafiają do archiwum.':'Historia zakończonych i anulowanych spraw. Dane pozostają zapisane.';return heading(viewNames[view],desc,(admin()&&view==='quotes'?button('Dodaj wycenę','new-task','','primary'):'')+button(mode==='table'?'Widok kart':'Widok tabeli','toggle-mode'))+`<div class="filters">${['all',...statuses,...(view==='archive'?['unpaid']:[])].map(x=>`<button data-filter="${x}" class="${filter===x?'active':''}">${x==='all'?'Wszystkie':x==='unpaid'?'Nieopłacone':statusNames[x]}</button>`).join('')}</div>`+(mode==='table'?taskTable(items):items.length?`<div class="grid">${items.map(t=>`<article class="card order"><div class="title"><small>${esc(t.number)}</small>${badge(t.status)}</div><h3>${esc(t.name)}</h3><p>${esc(t.clientName)}<br>${esc(t.address)}<br>${['new','quoted'].includes(t.status)?'Termin do ustalenia':dt(t.dateStart)}</p>${admin()?`<h2>${money(t.finalPrice??t.price)}</h2>`:''}<div class="actions">${taskActions(t)}</div></article>`).join('')}</div>`:empty())}
function calendar(){const month=$('month').value,[year,m]=month.split('-').map(Number),days=new Date(year,m,0).getDate(),offset=(new Date(year,m-1,1).getDay()+6)%7;const tasks=search(state.tasks.filter(t=>['planned','progress'].includes(t.status)&&monthOf(t.dateStart)===month));return heading('Kalendarz realizacji','Termin jest ustalany przy przyjęciu wyceny. Wybierz miesiąc u góry.')+`<div class="calendar">${['Pon','Wt','Śr','Czw','Pt','Sob','Nd'].map(x=>`<div class="day-head">${x}</div>`).join('')}${'<div class="day"></div>'.repeat(offset)}${Array.from({length:days},(_,i)=>`<div class="day"><strong>${i+1}</strong>${tasks.filter(t=>Number(new Intl.DateTimeFormat('en-GB',{day:'numeric',timeZone:'Europe/Warsaw'}).format(new Date(t.dateStart)))===i+1).map(t=>`<button data-action="task" data-id="${t._id}">${esc(t.name)}<br>${esc(t.car)}</button>`).join('')}</div>`).join('')}</div>`}
function clientsView(){return heading('Baza klientów','Dane z wycen są zapisywane automatycznie i łączone według numeru telefonu.')+table(['Klient','Telefon','Adres / trasa','Usługi','Zlecenia',''],search(state.clients).map(c=>[`<strong>${esc(c.name)}</strong><span class="sub">${esc(c.company)}</span>`,`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`,`<span class="sub">${esc(c.address)}</span>`,esc((c.services||[]).join(', ')),state.tasks.filter(t=>id(t.client)===id(c)).length,button('Historia / edycja','client',c._id,'small')]))}
function employeesView(){return heading('Ludzie, którzy robią robotę.','Stanowiska, dostępność, stawki i rozliczenia. Dezaktywacja zachowuje historię.',button('Dodaj pracownika','employee','','primary'))+`<div class="grid">${search(state.employees).map(e=>{const pay=(state.ledger?.costs||[]).filter(c=>c.employee===id(e)&&monthOf(c.date)===$('month').value);return `<article class="card"><div class="title"><span class="badge ${e.active?'planned':'cancelled'}">${e.active?'Aktywny':'Nieaktywny'}</span></div><h2 style="margin-top:18px">${esc(e.name)}</h2><p class="muted">${esc(e.role)} · ${esc({available:'Dostępny',busy:'Zajęty',off:'Wolne'}[e.status]||e.status)}</p><div class="list-line"><span>Stawka godzinowa</span><strong>${money(e.hourlyRate)}</strong></div><div class="list-line"><span>Stawka miesięczna</span><strong>${money(e.monthlySalary)}</strong></div><div class="list-line"><span>Rozliczono w miesiącu</span><strong>${money(pay.reduce((a,c)=>a+c.amount,0))}</strong></div><div class="actions section-gap">${button('Profil / edycja','employee',e._id,'small')}${button('Rozlicz pracę','payroll',e._id,'small primary')}</div></article>`}).join('')||empty('Dodaj pierwszego pracownika.')}</div>`}
function fleetView(){return heading('Flota gotowa do pracy.','Przebiegi, dostępność, OC, przeglądy, serwis i przypisane koszty.',button('Dodaj pojazd','vehicle','','primary'))+`<div class="grid">${search(state.fleet).map(f=>`<article class="card"><span class="badge ${f.status==='service'?'progress':'planned'}">${esc({available:'Dostępny',route:'W trasie',service:'Serwis',inactive:'Nieaktywny'}[f.status])}</span><h2 style="margin-top:18px">${esc(f.name)}</h2><p class="muted">${esc(f.plates)}</p><div class="list-line"><span>Przebieg</span><strong>${Number(f.mileage||0).toLocaleString('pl-PL')} km</strong></div><div class="list-line"><span>Koszty miesiąca</span><strong>${money((state.ledger?.costs||[]).filter(c=>c.vehicle===id(f)&&monthOf(c.date)===$('month').value).reduce((a,c)=>a+c.amount,0))}</strong></div><p class="bottom-note">OC: ${f.insuranceUntil?dt(f.insuranceUntil).split(',')[0]:'nie podano'}<br>Przegląd: ${f.inspectionUntil?dt(f.inspectionUntil).split(',')[0]:'nie podano'}</p><div class="actions">${button('Zarządzaj','vehicle',f._id,'small')}${button('Dodaj koszt','vehicle-cost',f._id,'small primary')}</div></article>`).join('')||empty('Dodaj pierwszy pojazd.')}</div>`}

function ledgerTable(rows){return table(['Data','Kategoria','Opis','Kwota','Powiązanie'],rows.map(r=>[dt(r.date),esc(r.category),`<span class="sub">${esc(r.description)}</span>`,`<strong>${money(r.amount)}</strong>`,r.task?button(esc(state.tasks.find(t=>id(t)===r.task)?.number||'Zlecenie'),'task',r.task,'small'):r.employee?esc(state.employees.find(e=>id(e)===r.employee)?.name||'Pracownik'):'—']))}
function reports(){const t=state.ledger?.totals||{};const categories={};for(const c of financeRows('costs'))categories[c.category]=(categories[c.category]||0)+c.amount;return heading('Raport miesiąca '+esc($('month').value),'Miesiące według czasu polskiego. Zmiana miesiąca nie usuwa danych.',button('Koszty CSV','export-costs')+button('Przychody CSV','export-income'))+`<div class="grid four">${stat('Przychód',money(t.income),'Wybrany miesiąc')}${stat('Koszty',money(t.cost),'Wybrany miesiąc')}${stat('Wynik',money(t.profit),'Przed podatkami i innymi nieuwzględnionymi pozycjami','arrow-trend-up','profit')}${stat('Zrealizowane',t.completed||0,'Zlecenia zakończone w miesiącu')}</div><div class="grid two section-gap"><article class="card"><h2>Koszty według kategorii</h2>${Object.entries(categories).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="list-line"><span>${esc(k)}</span><strong>${money(v)}</strong></div>`).join('')||empty()}</article><article class="card"><h2>Cała historia działalności</h2><div class="list-line"><span>Łączny przychód</span><strong>${money(t.allIncome)}</strong></div><div class="list-line"><span>Łączne koszty</span><strong>${money(t.allCost)}</strong></div><div class="list-line"><span>Łączny wynik</span><strong>${money(t.allProfit)}</strong></div><p class="bottom-note">Stawki pracowników są informacją do rozliczenia. Koszt powstaje dopiero po dodaniu rozliczenia pracy. Dane raportu są operacyjne, a nie deklaracją podatkową.</p></article></div>`}
function historyView(){const events=search(state.tasks.flatMap(t=>(t.workflowEvents||[]).map(e=>({...e,task:t._id,number:t.number})))).sort((a,b)=>new Date(b.at)-new Date(a.at));return heading('Historia decyzji i kosztów.','Każda zmiana statusu ma datę, autora i zapis nowych kosztów.')+table(['Kiedy','Zlecenie','Zmiana','Nowy koszt','Opis','Kto'],events.map(e=>[dt(e.at),button(esc(e.number),'task',e.task,'small'),`${badge(e.from)} → ${badge(e.to)}`,money(e.cost),`<span class="sub">${esc(e.costDescription)}</span>`,esc(e.actor)]))}
const field=(name,label,value='',type='text',extra='')=>`<div class="field"><label for="f-${name}">${label}</label><input class="input" id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
const area=(name,label,value='',max=2000)=>`<div class="field full"><label for="f-${name}">${label}</label><textarea class="input" id="f-${name}" name="${name}" maxlength="${max}">${esc(value)}</textarea></div>`;

const dateOnly=v=>v?String(v).slice(0,10):'';
function openModal(title,body){if(dialogBusy)return;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0}
function formModal(title,body,onSubmit,label='Zapisz'){openModal(title,`<form id="editForm"><div class="form-grid">${body}</div><div class="error section-gap" id="formError" role="alert" hidden></div><div class="dialog-foot"><button type="button" class="btn" data-action="close">Anuluj</button><button type="submit" class="btn primary">${label}</button></div></form>`);$('editForm').addEventListener('submit',async e=>{e.preventDefault();if(dialogBusy)return;const data=Object.fromEntries(new FormData(e.target));dialogBusy=true;const controls=[...e.target.elements];controls.forEach(x=>x.disabled=true);$('formError').hidden=true;try{await onSubmit(data);$('modal').close();await load();toast('Zapisano zmiany.')}catch(err){$('formError').textContent=err.message;$('formError').hidden=false}finally{dialogBusy=false;controls.forEach(x=>x.disabled=false)}})}
function costFields(){return `<div class="field full notice">Wpisz <strong>tylko nowe koszty tej operacji</strong>, a nie sumę wcześniej wpisanych. Jeśli nic nie doszło, wpisz 0.</div>`+field('cost','Nowe koszty (zł) *','','number','min="0" step="0.01" required')+select('costCategory','Kategoria kosztu','Koszt zlecenia',[['Koszt zlecenia','Koszt zlecenia'],['Paliwo','Paliwo'],['Bramki i parking','Bramki i parking'],['Materiały','Materiały'],['Inne','Inne']])+area('costDescription','Opis kosztu — obowiązkowy przy kwocie większej od 0','',1000)}
async function statusSave(t,status,data,requestId){return api('/api/v3/tasks/'+t._id+'/status',{method:'POST',body:JSON.stringify({...data,status,expectedStatus:t.status,requestId})})}
function offer(t){const requestId=crypto.randomUUID();const scope=t.offerScope||t.desc||'';formModal('Przygotuj ofertę · '+t.number,field('price','Cena oferty dla klienta (zł) *',t.price||'','number','min="0" step="0.01" required')+field('validity','Informacja o terminie / ważności','Termin do potwierdzenia','text','maxlength="200"')+area('offerScope','Co obejmuje oferta',scope,2500)+`<div class="field full actions">${button('Wygeneruj wiadomość','generate-offer',t._id)}${button('Kopiuj wiadomość','copy-offer')}</div>`+area('offerMessage','Wiadomość do klienta — możesz ją edytować',t.offerMessage||'',5000)+`<div class="field full notice">Zapisanie oferty nie wysyła SMS-a ani wiadomości. Skopiuj treść, przekaż klientowi i po jego zgodzie wybierz „Klient akceptuje”.</div>`+costFields(),data=>statusSave(t,'quoted',data,requestId),'Zapisz ofertę');if(!t.offerMessage&&t.price)generateOffer(t);let manual=false;$('f-offerMessage').addEventListener('input',()=>manual=true);for(const key of ['price','offerScope','validity'])$('f-'+key).addEventListener('input',()=>{if(!manual&&$('f-price').value)generateOffer(t)})}
function generateOffer(t){const amount=$('f-price')?.value;if(!amount){toast('Najpierw wpisz cenę oferty.');return}const message=`Dzień dobry${t.clientName?' '+t.clientName:''}!\n\nWycena usługi: ${t.type||t.name}\nLokalizacja / trasa: ${t.address||'do ustalenia'}\nCena: ${money(amount)}\n\nW cenie uwzględniono:\n${$('f-offerScope').value||'Zakres uzgodniony z klientem.'}\n\n${$('f-validity').value}\n\nJeśli akceptują Państwo ofertę, prosimy o potwierdzenie. Uzgodnimy dostępność terminu i realizację.\n\nRevSerwis\nTel. 735 396 534\nNumer wyceny: ${t.number}`;$('f-offerMessage').value=message.slice(0,5000)}
function transition(t,type){const requestId=crypto.randomUUID();let status,title,extra='';if(type==='accept'){status='planned';title='Przyjmij zaakceptowane zlecenie';extra=`<div class="field full notice">Uzgodniona cena: <strong>${money(t.price)}</strong>. Po zapisaniu zlecenie trafi do „Do realizacji”.</div>`+field('dateStart','Ustalony termin realizacji *','','datetime-local','required')+`<div class="field full"><label class="check"><input type="checkbox" name="clientAccepted" value="yes" required> Klient zaakceptował ofertę i termin.</label></div>`}else if(type==='start'){status='progress';title='Rozpocznij realizację'}else if(type==='complete'){status='completed';title='Zakończ i rozlicz zlecenie';extra=field('finalPrice','Końcowy przychód ze zlecenia (zł) *',t.price,'number','min="0" step="0.01" required')+select('paymentStatus','Płatność','unpaid',[['unpaid','Do zapłaty'],['paid','Zapłacono']])+`<div class="field full notice">Zlecenie trafi do archiwum. Kwota końcowa zostanie ujęta raz w przychodzie miesiąca zakończenia.</div>`}else if(type==='pause'){status='planned';title='Przenieś z powrotem do zaplanowanych'}else{status='cancelled';title='Anuluj zlecenie';extra='<div class="field full notice warn">Sprawa zostanie w archiwum. Poniesione koszty pozostaną w zestawieniach.</div>'}formModal(title,extra+costFields(),data=>statusSave(t,status,{...data,clientAccepted:data.clientAccepted==='yes',...(data.dateStart?{dateStart:new Date(data.dateStart).toISOString()}: {})},requestId),'Potwierdź zmianę statusu')}
function taskModal(t){if(!t)return;const costs=(state.ledger?.costs||[]).filter(c=>c.task===id(t)),locked=['completed','cancelled'].includes(t.status);let html=`<div class="actions" style="margin-bottom:20px">${badge(t.status)}<span class="muted">${esc(t.number)}</span>${admin()?`<strong style="margin-left:auto">${money(t.finalPrice??t.price)}</strong>`:''}</div><div class="grid two"><div><h3>Klient</h3><p>${esc(t.clientName||'Bez nazwy')}<br><a style="color:var(--light)" href="tel:${esc(t.clientPhone)}">${esc(t.clientPhone)}</a></p></div><div><h3>Adres i termin</h3><p class="preserve">${esc(t.address)}<br>${['new','quoted'].includes(t.status)?'Termin do ustalenia':dt(t.dateStart)}</p></div></div><h3>Opis zgłoszenia</h3><div class="preserve">${esc(t.desc||'Brak opisu')}</div><div class="section-gap"><h3>Ekipa i pojazd</h3><p class="muted">${esc((t.workers||[]).map(w=>w.name+' — '+w.role).join(', ')||'Nie przypisano pracowników')}<br>${esc(t.car||'Nie przypisano pojazdu')}</p></div>`;
 if(admin()){html+=`<div class="actions section-gap">${!locked?button('Edytuj / przypisz ekipę','edit-task',t._id):''}${t.status==='new'||t.status==='quoted'?button(t.status==='quoted'?'Zmień ofertę':'Przygotuj ofertę','offer',t._id,'primary'):''}${t.status==='quoted'?button('Klient akceptuje','accept',t._id,'primary'):''}${t.status==='planned'?button('Rozpocznij','start',t._id,'primary'):''}${t.status==='progress'?button('Zakończ i rozlicz','complete',t._id,'primary')+button('Wstrzymaj','pause',t._id):''}${!locked?button('Anuluj','cancel',t._id,'danger'):''}${button('Dodaj koszt','task-cost',t._id)}</div>`;if(t.status==='completed')html+=`<div class="notice section-gap">Płatność: ${esc({paid:'Zapłacono',unpaid:'Do zapłaty',partial:'Częściowa'}[t.paymentStatus]||'Do zapłaty')} ${button(t.paymentStatus==='paid'?'Oznacz do zapłaty':'Oznacz zapłacono','payment',t._id,'small')}</div>`;if(t.offerMessage)html+=`<details class="section-gap"><summary>Ostatnia zapisana oferta</summary><textarea class="input" id="savedOffer" rows="9" readonly>${esc(t.offerMessage)}</textarea><div class="section-gap">${button('Kopiuj ofertę','copy-saved')}</div></details>`;html+=`<details class="section-gap"><summary>Koszty zlecenia: ${money(costs.reduce((a,c)=>a+c.amount,0))}</summary>${ledgerTable(costs)}</details><details class="section-gap"><summary>Historia statusów</summary><div class="timeline">${(t.workflowEvents||[]).map(e=>`<p><strong>${esc(statusNames[e.from])} → ${esc(statusNames[e.to])}</strong><br>${dt(e.at)} · ${esc(e.actor)}<br>Nowy koszt: ${money(e.cost)} · ${esc(e.costDescription)}</p>`).join('')||'<p>Brak zmian zapisanych w nowym panelu.</p>'}</div></details>`;if(t.quotePhotoCount)html+='<section class="section-gap"><h3>Zdjęcia do wyceny</h3><div class="photos" id="photos"></div><p class="muted" id="photoMessage">Wczytuję zdjęcia…</p></section>'}

async function loadPhotos(t){const host=$('photos');try{for(let i=0;i<t.quotePhotoCount;i++){const r=await fetch(API_URL+'/api/tasks/'+t._id+'/photos/'+i,{credentials:'include'});if(!r.ok)throw Error('Nie można pobrać zdjęcia.');const blob=await r.blob();if(!host.isConnected)return;const url=URL.createObjectURL(blob);photoUrls.push(url);const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=url;img.alt='Zdjęcie do wyceny '+(i+1);a.append(img);host.append(a)}if($('photoMessage'))$('photoMessage').textContent='Kliknij zdjęcie, aby otworzyć pełny rozmiar.'}catch(e){if($('photoMessage'))$('photoMessage').textContent=e.message}}

 if(!isNew){if(!['new','quoted'].includes(base.status))fields+=field('dateStart','Termin realizacji',localDate(base.dateStart),'datetime-local','required');fields+=select('vehicle','Przypisany pojazd',id(base.vehicle),[['','Bez pojazdu'],...state.fleet.filter(f=>f.active&&!['service','inactive'].includes(f.status)).map(f=>[id(f),f.name+' · '+f.plates])])+`<div class="field full"><label>Pracownicy do zlecenia</label><div class="grid two">${state.employees.filter(e=>e.active).map(e=>`<label class="check"><input type="checkbox" name="crew" value="${e._id}" ${(base.workers||[]).some(w=>id(w.employee)===id(e))?'checked':''}>${esc(e.name)} · ${esc(e.role)}</label>`).join('')||'<span class="muted">Dodaj pracowników w zakładce Pracownicy.</span>'}</div></div>`}else fields+='<div class="field full notice">Nowy wpis trafi do wycen. Przygotuj ofertę i przyjmij zlecenie po potwierdzeniu klienta.</div>';

function employeeModal(e){const b=e||{},payments=(state.ledger?.costs||[]).filter(c=>c.employee===id(b));formModal(e?'Profil pracownika':'Nowy pracownik',field('name','Imię i nazwisko *',b.name||'','text','required maxlength="140"')+field('role','Stanowisko *',b.role||'Kierowca','text','required maxlength="100" list="positions"')+'<datalist id="positions"><option>Kierowca</option><option>Pomocnik</option><option>Pracownik przeprowadzek</option><option>Koordynator</option><option>Dyspozytor</option></datalist>'+field('phone','Telefon',b.phone||'','tel','maxlength="40"')+select('status','Dostępność',b.status||'available',[['available','Dostępny'],['busy','Zajęty'],['off','Wolne / nieobecny']])+field('hourlyRate','Stawka godzinowa (zł)',b.hourlyRate||0,'number','min="0" step="0.01" required')+field('monthlySalary','Ustalona stawka miesięczna (zł)',b.monthlySalary||0,'number','min="0" step="0.01" required')+field('employmentType','Forma współpracy',b.employmentType||'','text','maxlength="80"')+field('startDate','Data rozpoczęcia',dateOnly(b.startDate),'date')+select('systemRole','Uprawnienia',b.systemRole||'worker',[['worker','Pracownik — podgląd realizacji'],['admin','Administrator — pełny dostęp']])+select('active','Konto i dostęp',b.active===false?'no':'yes',[['yes','Aktywne'],['no','Nieaktywne (historia zostaje)']])+field('pin',e?'Nowy PIN (puste = bez zmiany)':'PIN logowania (opcjonalnie)','','password','inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" autocomplete="new-password"')+area('notes','Notatki',b.notes||'',2000)+`<div class="field full notice">Stawka sama nie zwiększa kosztów. Dodaj „Rozlicz pracę”, aby zapisać rzeczywistą kwotę wynagrodzenia.</div>`+(e?`<div class="field full"><details><summary>Historia rozliczeń pracownika</summary>${ledgerTable(payments)}</details></div>`:''),data=>api('/api/v3/employees'+(e?'/'+e._id:''),{method:e?'PUT':'POST',body:JSON.stringify({...data,active:data.active==='yes'})}))}

function financeModal(kind,context={}){const requestId=crypto.randomUUID(),e=state.employees.find(e=>id(e)===context.employee);let fields=field('date','Data księgowania operacyjnego *',localDate(),'datetime-local','required');if(kind==='payroll'){fields+=field('hours','Liczba godzin',0,'number','min="0" step="0.25"')+field('rate','Stawka za godzinę (zł)',e?.hourlyRate||0,'number','min="0" step="0.01"')+`<div class="field actions">${button('Przelicz godziny × stawka','calculate-pay')}</div>`}else fields+=select('category','Kategoria',kind==='income'?'Inny przychód':'Paliwo',(kind==='income'?['Inny przychód','Usługa dodatkowa','Sprzedaż']:['Paliwo','Bramki i parking','Materiały','Serwis','Ubezpieczenie','Koszt zlecenia','Inne']).map(x=>[x,x]));fields+=field('price','Kwota (zł) *',kind==='payroll'?e?.monthlySalary||'':'','number','min="0" step="0.01" required')+area('desc','Opis — czego dotyczy wpis *',kind==='payroll'?'Rozliczenie pracy: '+e?.name:'',1000);if(kind!=='income')fields+=select('task','Powiązane zlecenie (opcjonalnie)',context.task||'',[['','Bez zlecenia'],...state.tasks.map(t=>[id(t),(t.number||'')+' · '+t.name])])+select('vehicle','Powiązany pojazd (opcjonalnie)',context.vehicle||'',[['','Bez pojazdu'],...state.fleet.map(f=>[id(f),f.name+' '+f.plates])]);if(kind==='income')fields+='<div class="field full notice">Nie wpisuj ponownie ceny zakończonego zlecenia — została już dodana automatycznie. Ten formularz służy innym przychodom.</div>';formModal(kind==='payroll'?'Rozlicz pracę · '+e?.name:kind==='income'?'Dodaj inny przychód':'Dodaj koszt',fields,data=>api('/api/v3/finance',{method:'POST',body:JSON.stringify({...data,...(kind==='payroll'?{employee:context.employee}:{}),kind,requestId,date:new Date(data.date).toISOString()})}),'Zapisz w finansach');$('f-desc').required=true}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Skopiowano wiadomość.')}catch{const target=$('f-offerMessage')||$('savedOffer');if(target){target.focus();target.select();toast('Zaznaczyłem tekst — skopiuj go skrótem Ctrl+C.')}}}
function exportCSV(kind){const rows=financeRows(kind,filter==='alltime'),cells=[['Data','Kategoria','Opis','Kwota PLN','Zlecenie'],...rows.map(r=>[dt(r.date),r.category,r.description,Number(r.amount).toFixed(2).replace('.',','),state.tasks.find(t=>id(t)===r.task)?.number||''])];const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const blob=new Blob(['\ufeff'+cells.map(r=>r.map(safe).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RevMi-'+kind+'-'+(filter==='alltime'?'historia':$('month').value)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',async event=>{const nav=event.target.closest('[data-view]');if(nav){go(nav.dataset.view);return}const fb=event.target.closest('[data-filter]');if(fb){filter=fb.dataset.filter;render();return}const b=event.target.closest('[data-action]');if(!b||dialogBusy)return;const action=b.dataset.action,entity=b.dataset.id,t=state.tasks.find(t=>id(t)===entity);try{if(action.startsWith('view-'))go(action.slice(5));else if(action==='close')$('modal').close();else if(action==='toggle-mode'){mode=mode==='table'?'cards':'table';render()}else if(action==='new-task')editTask();else if(action==='task')taskModal(t);else if(action==='edit-task')editTask(t);else if(action==='offer')offer(t);else if(['accept','start','complete','pause','cancel'].includes(action))transition(t,action);else if(action==='generate-offer')generateOffer(t);else if(action==='copy-offer')await copy($('f-offerMessage').value);else if(action==='copy-saved')await copy($('savedOffer').value);else if(action==='employee')employeeModal(state.employees.find(e=>id(e)===entity));else if(action==='vehicle')vehicleModal(state.fleet.find(f=>id(f)===entity));else if(action==='client')clientModal(state.clients.find(c=>id(c)===entity));else if(action==='expense')financeModal('expense');else if(action==='income')financeModal('income');else if(action==='task-cost')financeModal('expense',{task:entity,vehicle:id(t?.vehicle)});else if(action==='vehicle-cost')financeModal('expense',{vehicle:entity});else if(action==='payroll')financeModal('payroll',{employee:entity});else if(action==='calculate-pay')$('f-price').value=(Number($('f-hours').value)*Number($('f-rate').value)).toFixed(2);else if(action==='payment'){dialogBusy=true;await api('/api/v3/tasks/'+entity+'/payment',{method:'PATCH',body:JSON.stringify({paymentStatus:t.paymentStatus==='paid'?'unpaid':'paid'})});dialogBusy=false;$('modal').close();await load();toast('Zaktualizowano płatność.')}else if(action==='export')exportCSV(view);else if(action==='export-costs')exportCSV('costs');else if(action==='export-income')exportCSV('income')}catch(e){dialogBusy=false;toast(e.message)}});
$('closeModal').onclick=()=>{if(!dialogBusy)$('modal').close()};$('modal').addEventListener('cancel',e=>{if(dialogBusy)e.preventDefault()});$('modal').addEventListener('close',()=>{photoUrls.forEach(URL.revokeObjectURL);photoUrls=[]});$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('search').addEventListener('input',render);$('month').addEventListener('change',()=>{autoMonth=$('month').value===monthOf(new Date());if($('month').value)load()});$('refresh').onclick=load;$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'});lock()}catch(e){toast(e.message)}};
