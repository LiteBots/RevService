<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Potwierdzenie terminu — RevSerwis</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0c0f; --card: #15161a; --line: rgba(255,255,255,.1); --text: #eef1f0; --muted: #8f9895; --accent: #03f0ba; --ink: #03241b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at 50% 0%, rgba(3,240,186,.22), transparent 55%), var(--bg); display: grid; place-items: center; padding: 20px; }
    .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 26px; }
    .logo { font-weight: 800; font-size: 24px; margin-bottom: 18px; } .logo b { color: var(--accent); }
    h1 { font-size: 22px; margin: 0 0 6px; } p { margin: 0; } .muted { color: var(--muted); }
    .row { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
    .box { background: rgba(255,255,255,.04); border-radius: 14px; padding: 14px; margin: 18px 0; }
    button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 14px; width: 100%; cursor: pointer; margin-top: 10px; }
    .primary { background: var(--accent); color: var(--ink); } .ghost { background: rgba(255,255,255,.07); color: var(--text); }
    textarea { width: 100%; margin-top: 10px; border-radius: 12px; border: 1px solid var(--line); background: #0f1013; color: var(--text); padding: 10px; font: inherit; min-height: 80px; }
    .ok { color: var(--accent); font-weight: 800; font-size: 18px; } .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><b>Rev</b>Serwis</div>
    <div id="app"><p class="muted">Wczytywanie…</p></div>
    <p class="muted" style="margin-top:22px;font-size:13px">Pytania? <a style="color:#03f0ba" href="tel:+48735396534">735 396 534</a> · <a style="color:#03f0ba" href="https://wa.me/48735396534" target="_blank" rel="noopener">WhatsApp</a> · <a style="color:#03f0ba" href="https://www.instagram.com/revserwis_/" target="_blank" rel="noopener">Instagram</a></p>
  </main>
  <script>
    (function () {
      var app = document.getElementById('app');
      var token = new URLSearchParams(location.search).get('t') || '';
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      var when = function (d) { return new Date(d).toLocaleString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); };
      function fail(msg) { app.innerHTML = '<h1>Ups…</h1><p class="muted">' + esc(msg) + '</p><p class="muted" style="margin-top:14px">Zadzwoń do nas: <a style="color:#03f0ba" href="tel:+48735396534">735 396 534</a></p>'; }
      function send(action, note) {
        return fetch('/api/v2/public/confirm/' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, note: note || '' }) })
          .then(function (r) { return r.json(); });
      }
      fetch('/api/v2/public/confirm/' + encodeURIComponent(token)).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.success) return fail(d.message || 'Link jest nieprawidłowy lub wygasł.');
        var t = d.task;
        var eta = t.kind === 'ontheway' && t.etaAt;
        app.innerHTML =
          '<h1>' + (eta ? 'Ekipa jest w drodze 🚚' : 'Twój termin') + '</h1>' +
          '<p class="muted">' + esc(t.name) + '</p>' +
          '<div class="box"><div><b>' + esc(when(eta || t.dateStart)) + '</b>' + (eta ? ' <span class="muted">(przewidywany przyjazd)</span>' : '') + '</div>' +
          (t.address ? '<div class="muted">' + esc(t.address) + '</div>' : '') +
          (t.crew && t.crew.length ? '<div class="muted">Ekipa: ' + esc(t.crew.join(', ')) + '</div>' : '') + '</div>' +
          (t.confirmed || t.state === 'confirmed' ? '<p class="ok">✓ Termin potwierdzony. Do zobaczenia!</p>' :
            '<button class="primary" id="ok">Potwierdzam termin</button>' +
            '<button class="ghost" id="ch">Proszę o zmianę terminu</button>' +
            '<div id="chBox" class="hidden"><textarea id="note" placeholder="Kiedy Państwu pasuje?"></textarea><button class="ghost" id="chSend">Wyślij prośbę</button></div>');
        var ok = document.getElementById('ok');
        if (ok) ok.addEventListener('click', function () { send('confirm').then(function (r) { if (r.success) app.innerHTML = '<p class="ok">✓ Dziękujemy! Termin potwierdzony.</p><p class="muted" style="margin-top:8px">' + esc(when(t.dateStart)) + '</p>'; else fail(r.message); }); });
        var ch = document.getElementById('ch');
        if (ch) ch.addEventListener('click', function () { document.getElementById('chBox').classList.remove('hidden'); ch.classList.add('hidden'); });
        var cs = document.getElementById('chSend');
        if (cs) cs.addEventListener('click', function () { send('reschedule', document.getElementById('note').value).then(function (r) { if (r.success) app.innerHTML = '<p class="ok">Dziękujemy!</p><p class="muted" style="margin-top:8px">Oddzwonimy, żeby ustalić nowy termin.</p>'; else fail(r.message); }); });
      }).catch(function () { fail('Brak połączenia. Spróbuj ponownie za chwilę.'); });
    })();
  </script>
<a class="rv-wa-float" href="https://wa.me/48735396534?text=Dzie%C5%84%20dobry%2C%20chcia%C5%82bym%20zapyta%C4%87%20o%20wycen%C4%99." rel="noopener" target="_blank" aria-label="Napisz do nas na WhatsApp"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i><span>Napisz na WhatsApp</span></a>
</body>
</html>
